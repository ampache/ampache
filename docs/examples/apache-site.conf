# EXAMPLE TAKEN FROM
# https://ampache.org/docs/installation/#apache
#
# A complete Apache 2.4 vhost for Ampache. Copy it to /etc/apache2/sites-available/ampache.conf,
# edit the paths and server name, then `a2ensite ampache && systemctl reload apache2`.
#
# Modules this uses: rewrite, headers, proxy_fcgi (php-fpm), proxy_wstunnel (websocket), ssl.
#   sudo a2enmod rewrite headers proxy_fcgi proxy_wstunnel ssl

<VirtualHost *:80>
    ServerName my_server_name

    # Leave the acme-challenge path alone so certbot can still renew over plain http.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName my_server_name

    # Point this at the web root, which depends on the layout you installed:
    #   git checkout / composer install  -> /path/to/ampache/public
    #   release zip (squashed)           -> /path/to/ampache
    DocumentRoot /path/to/ampache/root/directory

    ErrorLog  /var/log/ampache/error.log
    # CustomLog /var/log/ampache/access.log combined

    # SSLEngine on
    # SSLCertificateFile      /path/to/fullchain.pem
    # SSLCertificateKeyFile   /path/to/privkey.pem
    # Use secure SSL/TLS settings, see https://ssl-config.mozilla.org/
    # SSLProtocol -all +TLSv1.2 +TLSv1.3
    # SSLHonorCipherOrder off
    # Header always set Strict-Transport-Security "max-age=15768000"

    # Use secure headers to avoid XSS and many other things
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options nosniff
        Header set X-Robots-Tag none
        Header set X-Download-Options noopen
        Header set X-Permitted-Cross-Domain-Policies none
        Header always set X-Frame-Options "SAMEORIGIN"
        Header set Referrer-Policy "no-referrer"
        Header set Content-Security-Policy "script-src 'self' 'unsafe-inline' 'unsafe-eval'; frame-src 'self'; object-src 'self'"
    </IfModule>

    # Avoid information leak. Both are global directives, so they belong in apache2.conf or
    # conf-available/security.conf rather than here, listed only so they are not forgotten.
    # ServerTokens Prod
    # ServerSignature Off

    <Directory /path/to/ampache/root/directory>
        # No Indexes: Ampache never needs a generated directory listing.
        Options FollowSymLinks
        Require all granted

        # Ampache ships the rewrite rules it needs in .htaccess files, and reads none of them
        # without this. Setting it to None means copying public/rest/.htaccess.dist and
        # public/play/.htaccess.dist into this file by hand, or streaming and the APIs 404.
        AllowOverride All

        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    </Directory>

    # PRIVATE PATHS
    # These repeat what public/.htaccess.dist already blocks, so they still apply with
    # AllowOverride None. Only the squashed (release zip) layout puts these in the web root;
    # serving from public/ they do not exist and the rules cost nothing.
    # Anchored to the document root on purpose: bundled javascript ships its own src/ directories
    # under lib/components/, and an unanchored match would stop those being served.
    <DirectoryMatch "^/path/to/ampache/root/directory/(bin|config|docker|docs|locale|node_modules|resources|src|tests|vendor)/">
        Require all denied
    </DirectoryMatch>

    # Dotted directories at any depth (.git, .idea, .github), and every file inside them.
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.|\.cfg\.php$|\.(bak|old|orig|save|swp|swo|sql|log|ini|neon|sh|dist|cache|md|lock)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^(composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml|rector\.php|vite\.config\.js)$">
        Require all denied
    </FilesMatch>

    # Hand .php to php-fpm. Check the socket path against your PHP version.
    <IfModule mod_proxy_fcgi.c>
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </IfModule>

    # Apache 2.4.54+ refuses a Content-Length from a CGI-like backend by default, which breaks
    # downloads of a single song. See https://github.com/ampache/ampache/issues/3993
    <Directory /path/to/ampache/root/directory/play>
        SetEnv ap_trust_cgilike_cl 1
    </Directory>

    # Catalog updates report progress over server-sent events, which compression and a short
    # backend timeout both break. A long catalog scan holds the connection open for the whole run.
    <IfModule mod_proxy.c>
        ProxyTimeout 3600
    </IfModule>
    <Location "/server/sse.server.php">
        SetEnv no-gzip 1
        SetEnv dont-vary 1
    </Location>

    # If progress arrives in bursts at the end instead of live, mod_proxy_fcgi is buffering the
    # response. Route that one script explicitly so flushpackets can be set, and match the path.
    #<IfModule mod_proxy_fcgi.c>
    #    ProxyPass "/server/sse.server.php" "unix:/run/php/php8.5-fpm.sock|fcgi://localhost/path/to/ampache/root/directory/server/sse.server.php" flushpackets=on timeout=3600
    #</IfModule>

    # The REST API maps PUT to *_create, PATCH to *_edit and DELETE to *_delete, so those verbs
    # have to reach it. Apache allows them by default; this only documents the set in use.
    <Location "/rest">
        <LimitExcept GET POST PUT PATCH DELETE HEAD OPTIONS>
            Require all denied
        </LimitExcept>
    </Location>

    # Rewrite rule for WebSocket
    <IfModule mod_proxy_wstunnel.c>
        ProxyPass        /ws/ ws://127.0.0.1:8100/
        ProxyPassReverse /ws/ ws://127.0.0.1:8100/
    </IfModule>
</VirtualHost>
