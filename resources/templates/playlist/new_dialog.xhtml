<!DOCTYPE html>
<html>
<div class="playlistdialog_lists">
    <div class="playlistdialog_group" tal:condition="ADAPTER/getPlaylistsEnabled">
        <h4 class="playlistdialog_heading" tal:content="ADAPTER/getPlaylistHeading">PLAYLIST</h4>
        <ul>
            <li>
                <a
                    href="javascript:void(0);"
                    id="rb_append_dplaylist_new"
                    onclick="createNewPlaylist('${ADAPTER/getNewPlaylistTitle}', '${ADAPTER/getAjaxUri}?page=playlist&action=append_item&item_type=${ADAPTER/getObjectType}&item_id=${ADAPTER/getObjectIds}', 'rb_append_dplaylist_new', '${ADAPTER/getObjectGroups}');"
                    tal:content="ADAPTER/getNewPlaylistTitle"
                >TITLE</a>
            </li>
            <li tal:repeat="playlist ADAPTER/getPlaylists">
                <a
                    href="javascript:void(0);"
                    id="rb_append_dplaylist_${playlist/id}"
                    onclick="handlePlaylistAction('${ADAPTER/getAjaxUri}?page=playlist&action=append_item&playlist_id=${playlist/id}&item_type=${ADAPTER/getObjectType}&item_id=${ADAPTER/getObjectIds}', 'rb_append_dplaylist_${playlist/id}', '${ADAPTER/getObjectGroups}');"
                    tal:content="playlist/get_fullname"
                >NAME</a>
            </li>
        </ul>
    </div>
    <div class="playlistdialog_group" tal:condition="ADAPTER/getCollectionsEnabled">
        <h4 class="playlistdialog_heading" tal:content="ADAPTER/getCollectionHeading">COLLECTION</h4>
        <ul>
            <li>
                <a
                    href="javascript:void(0);"
                    id="rb_append_dcollection_new"
                    onclick="createNewPlaylist('${ADAPTER/getNewCollectionTitle}', '${ADAPTER/getAjaxUri}?page=collection&action=append_item&item_type=${ADAPTER/getObjectType}&item_id=${ADAPTER/getObjectIds}', 'rb_append_dcollection_new', '${ADAPTER/getObjectGroups}', 'collection_id');"
                    tal:content="ADAPTER/getNewCollectionTitle"
                >TITLE</a>
            </li>
            <li tal:repeat="collection ADAPTER/getCollections">
                <a
                    href="javascript:void(0);"
                    id="rb_append_dcollection_${collection/id}"
                    onclick="handlePlaylistAction('${ADAPTER/getAjaxUri}?page=collection&action=append_item&collection_id=${collection/id}&item_type=${ADAPTER/getObjectType}&item_id=${ADAPTER/getObjectIds}', 'rb_append_dcollection_${collection/id}', '${ADAPTER/getObjectGroups}', 'collection_id');"
                    tal:content="collection/get_fullname"
                >NAME</a>
            </li>
        </ul>
    </div>
</div>
</html>
