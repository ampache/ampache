; Development overrides for the Ampache docker dev environment.
; Copied into the PHP apache2 and cli conf.d directories by the Dockerfile.

; Show errors on screen while developing
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Give catalog scans / transcoding room to work
memory_limit = 512M
max_execution_time = 600
max_input_time = 600

; Allow large uploads (art, media, backups)
upload_max_filesize = 1024M
post_max_size = 1024M

; Default timezone to avoid warnings (adjust to taste)
date.timezone = UTC
